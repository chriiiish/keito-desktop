name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to cut from main and release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is the release's identity, so it decides the version rather than
  # merely accompanying one. v0.1.1 previously shipped files named 0.1.0,
  # because artifactName reads ${version} from package.json and nothing tied
  # the two together — a mistake only visible on the download page, after the
  # release was cut.
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # SemVer's own grammar rather than an approximation of it: numeric identifiers
          # carry no leading zeros, and a pre-release is dot-separated identifiers that
          # are each non-empty. A looser pattern lets "v1.2.3-beta..1" and "v1.2.3-."
          # through while the error below claims it checked for semver.
          NUM='(0|[1-9][0-9]*)'
          ID="($NUM|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if ! printf '%s' "$TAG" | grep -Eq "^v$NUM\.$NUM\.$NUM(-$ID(\.$ID)*)?$"; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH with an optional SemVer pre-release — refusing to release."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG as version ${TAG#v}"

  tag:
    name: Tag main
    # Only the manual path creates a tag; a tag push already has one.
    needs: [meta]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.meta.outputs.tag }}" -m "${{ needs.meta.outputs.tag }}"
          git push origin "${{ needs.meta.outputs.tag }}"

  build:
    name: Package (${{ matrix.artifact }})
    needs: [meta, tag]
    # always() so a tag push — where `tag` is skipped — still builds.
    if: always() && needs.meta.result == 'success' && needs.tag.result != 'failure'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner is arm64, so `--mac` alone would build only Apple
          # Silicon and leave Intel users with nothing to download.
          - os: macos-latest
            args: --mac --arm64 --x64
            artifact: mac
          - os: windows-latest
            args: --win
            artifact: win
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # After `npm ci`, so the install still sees the committed lockfile. The
      # version reaches the artifact filenames, the .app's Info.plist and
      # app.getVersion(), which is what the Contribute tab shows.
      - name: Stamp the released version
        shell: bash
        run: npm pkg set version="${{ needs.meta.outputs.version }}"

      - run: npm run build

      # The app is unsigned. Without CSC_IDENTITY_AUTO_DISCOVERY=false,
      # electron-builder hunts for a signing identity on macOS and fails.
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The stamp above is worth nothing if it silently fails to land, and a
      # glob upload would happily ship whatever it found.
      - name: Check the artifacts carry the released version
        shell: bash
        run: |
          shopt -s nullglob
          found=(release/*.dmg release/*.exe)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::No installers were produced."
            exit 1
          fi
          for file in "${found[@]}"; do
            case "$file" in
              *"-${{ needs.meta.outputs.version }}-"*) echo "ok  $file" ;;
              *) echo "::error::$file is not named for version ${{ needs.meta.outputs.version }}"; exit 1 ;;
            esac
          done

      # Just the installers. electron-builder also writes .blockmap and
      # latest*.yml, which exist only to feed electron-updater — nothing in this
      # app uses it, so they would be noise on the release page.
      - uses: actions/upload-artifact@v7
        with:
          name: keito-timer-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [meta, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          # Leads with the three installers, named and linked, because GitHub
          # appends "Source code (zip)" and "(tar.gz)" to every release and
          # gives no way to remove them. If the list cannot be shortened, the
          # thing to download has to be unmissable above it.
          #
          # The builds are ad-hoc signed, not notarised, so macOS refuses the
          # first launch. Saying so here is the difference between a user who
          # opens the app and one who assumes the download is broken.
          body: |
            ## Download

            | | File |
            | --- | --- |
            | **macOS** — Apple Silicon (M1 and later) | [`Keito-Timer-${{ needs.meta.outputs.version }}-Apple-Silicon.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}/Keito-Timer-${{ needs.meta.outputs.version }}-Apple-Silicon.dmg) |
            | **macOS** — Intel | [`Keito-Timer-${{ needs.meta.outputs.version }}-Intel-Mac.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}/Keito-Timer-${{ needs.meta.outputs.version }}-Intel-Mac.dmg) |
            | **Windows** | [`Keito-Timer-${{ needs.meta.outputs.version }}-Windows.exe`](https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}/Keito-Timer-${{ needs.meta.outputs.version }}-Windows.exe) |

            The *Source code* archives below are added by GitHub to every
            release and are not needed to install the app.

            ## First launch

            **macOS** — drag the app to Applications. The first launch is
            refused with "Apple could not verify…" because these builds are not
            notarised; open **System Settings → Privacy & Security** and press
            **Open Anyway**. Only needed once.

            **Windows** — run the `.exe`. SmartScreen shows "Windows protected
            your PC"; choose **More info → Run anyway**.

          files: |
            dist/*.dmg
            dist/*.exe

  # The build stamps the version into the artifacts, but the repository still said 0.1.0
  # afterwards — so `main` never matched anything that had shipped. This writes it back.
  record-version:
    name: Record the released version
    needs: [meta, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Pushes straight to main when the ruleset lets Actions through, and opens a pull
      # request when it does not. Both are correct outcomes; what would not be is failing
      # a release that has already happened because of how a branch rule is configured.
      - name: Write the version back
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail

          current=$(node -p "require('./package.json').version")
          if [ "$current" = "$VERSION" ]; then
            echo "package.json is already $VERSION — nothing to write back."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `npm version` rather than `npm pkg set`: it writes the lockfile too, and
          # leaving those two disagreeing is its own small mess.
          npm version --no-git-tag-version "$VERSION"
          git add package.json package-lock.json
          git commit -m "chore: set the version to $VERSION" \
                     -m "$TAG is released, so this is what package.json should say."

          if git push origin HEAD:main; then
            echo "Wrote $VERSION back to main."
            exit 0
          fi

          echo "::notice::Cannot push to main, so opening a pull request instead."
          branch="chore/version-$VERSION"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: set the version to $VERSION" \
            --body "$TAG is released. This writes that version back to package.json and package-lock.json, which still said $current.

          Opened by the release workflow because it could not push to main. Note that pull requests opened with GITHUB_TOKEN do not start workflow runs, so the usual checks will not appear here."
